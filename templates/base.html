<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HKHHQFQ8M3"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HKHHQFQ8M3', {send_page_view: false});
    gtag('event', 'page_view', {page_location: window.location.origin + window.location.pathname, page_title: document.title});
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/ATSForge white bg.png') }}">
  <title>{{ page.title }} | ATSForge</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="robots" content="{% if page.noindex %}noindex, nofollow{% else %}index, follow, max-image-preview:large{% endif %}">
  <link rel="canonical" href="{{ canonical_url }}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="ATSForge">
  <meta property="og:title" content="{{ page.title }} | ATSForge">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ canonical_url }}">
  <meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='img/og-atsforge.svg') }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }} | ATSForge">
  <meta name="twitter:description" content="{{ page.description }}">
  {% if google_site_verification %}<meta name="google-site-verification" content="{{ google_site_verification }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/content.css') }}">
  <script defer src="{{ url_for('static', filename='js/analytics.js', v='ga4-events-1') }}"></script>
  {% block extra_head %}{% endblock %}
  <script type="application/ld+json">{{ schema|tojson }}</script>
  {% if page.faq %}<script type="application/ld+json">{{ faq_schema|tojson }}</script>{% endif %}
</head>
<body{% if page.analytics_guide_slug %} data-analytics-guide-slug="{{ page.analytics_guide_slug }}" data-analytics-category="{{ page.analytics_category }}"{% endif %}>
  <header class="topbar content-topbar">
    <a class="brand" href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='img/ATSForge without bg.png') }}" alt="ATSForge logo" width="34" height="34"> ATSForge</a>
    <nav aria-label="Primary"><a href="{{ url_for('resume_tailor_page') }}">Tailor Resume</a><a href="{{ url_for('content_page', slug='ats-resume-guide') }}">Guides</a><a href="{{ url_for('resume_template_selector') }}">Templates</a><a href="{{ url_for('content_page', slug='pricing') }}">Pricing</a><a href="{{ url_for('content_page', slug='about') }}">About</a></nav>
    <a class="button small" href="{{ url_for('home') }}#builder" data-analytics-cta="build_my_cv" data-analytics-destination="resume_builder">Build my CV</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% include "partials/footer.html" %}
</body>
</html>
